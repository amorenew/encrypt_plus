name: encrypt_plus
version: 5.1.0
description: A set of high-level APIs over PointyCastle for two-way cryptography.
repository: https://github.com/amorenew/encrypt_plus

executables:
  secure-random:

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.7.0
  asn1lib: ^1.6.2
  clock: ^1.1.2
  collection: '>=1.18.0 <2.0.0'
  crypto: ^3.0.6
  pointycastle: '>=4.0.0 <5.0.0'

dev_dependencies:
  lints: ^5.1.1
  test: ^1.24.0

false_secrets:
  - /test/*.pem
